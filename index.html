<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Account Application &ndash; Syri Ltd.</title>
<style>
/* Syri Ltd. — entry page for the online Account Application Form.
   Front end only: no account is created and nothing is sent anywhere.
   A valid name and email simply open the form. */

:root{
  --navy:#1C2E7A;
  --navy-dark:#15235F;
  --ink:#1A1D29;
  --muted:#4A5B7F;
  --line:#D6E0EE;
  --sky-1:#E3F1FC;
  --sky-2:#C7E0F6;
  --err:#B42318;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);
  font:400 15px/1.6 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(135deg,var(--sky-1) 0%,var(--sky-2) 100%) fixed;
  display:flex;flex-direction:column;min-height:100vh;
}

/* Top bar */
.topbar{
  background:rgba(255,255,255,.9);
  border-bottom:1px solid rgba(28,46,122,.08);
  box-shadow:0 2px 14px rgba(28,46,122,.08);
}
.topbar .inner{max-width:920px;margin:0 auto;padding:12px 16px;display:flex;align-items:center}
.topbar img{height:40px;width:auto;display:block}

/* Content */
main{flex:1}
.inner{max-width:920px;margin:0 auto;padding:0 16px}
.content{display:flex;gap:48px;align-items:flex-start;justify-content:space-between;padding-top:34px}
.intro{flex:1;max-width:520px}
.intro h1{margin:4px 0 12px;font-size:28px;font-weight:600;letter-spacing:-.3px;color:var(--navy)}
.intro p{margin:0;font-size:15.5px;color:var(--muted)}

/* Register card */
.card{
  flex:0 0 300px;background:#fff;border:1px solid var(--line);border-radius:6px;
  box-shadow:0 8px 28px rgba(28,46,122,.12);
}
.card-head{padding:14px 18px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600}
.card-head em{font-weight:400;color:#3D7BC8}
.card-body{padding:18px}
.field{margin-bottom:18px}
label{display:block;margin-bottom:6px;font-size:12.5px;font-weight:600}
input{
  width:100%;font:inherit;font-size:14px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:9px 11px;
}
input::placeholder{color:#9AA5BA}
input:focus{outline:none;border-color:#3D7BC8;box-shadow:0 0 0 3px rgba(61,123,200,.18)}
.error{display:none;margin-top:5px;font-size:12.5px;color:var(--err)}
.invalid input{border-color:var(--err)}
.invalid .error{display:block}
.btn{
  font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  background:var(--navy);color:#fff;border:0;border-radius:4px;padding:10px 20px;
  box-shadow:0 2px 6px rgba(28,46,122,.25);
}
.btn:hover{background:var(--navy-dark)}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

footer{padding:24px 16px;text-align:center;font-size:11.5px;color:var(--muted)}

@media (max-width:720px){
  .content{flex-direction:column;gap:24px;padding-top:24px}
  .card{flex:none;width:100%}
  .intro h1{font-size:24px}
}
</style>
</head>

<main>
  <div class="inner content">
    <div class="intro">
      <h1>Account Application Form</h1>
      <p>Please enter your name and email address to access the Account Application Form.</p>
    </div>

    <section class="card" aria-labelledby="registerTitle">
      <div class="card-head" id="registerTitle">Register <em>Panel</em></div>
      <form class="card-body" id="registerForm" novalidate>
        <div class="field">
          <label for="regName">Name</label>
          <input type="text" id="regName" name="name" placeholder="Name" autocomplete="name" required
                 aria-describedby="regNameErr">
          <div class="error" id="regNameErr">Please enter your name</div>
        </div>
        <div class="field">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" name="email" placeholder="Email" autocomplete="email" required
                 aria-describedby="regEmailErr">
          <div class="error" id="regEmailErr">Please enter a valid email address</div>
        </div>
        <button type="submit" class="btn">Submit</button>
      </form>
    </section>
  </div>
</main>

<footer>
  Syri Ltd. · Unit 4, Bradfield Road, Ruislip, Middlesex, HA4 0NU · Tel 0208 728 7800
</footer>

<script>
(function () {
  'use strict';
  var form = document.getElementById('registerForm');
  var nameInput = document.getElementById('regName');
  var emailInput = document.getElementById('regEmail');
  var FORM_PAGE = 'syri-account-application-form.html';

  function check(input, ok) {
    input.closest('.field').classList.toggle('invalid', !ok);
    input.setAttribute('aria-invalid', ok ? 'false' : 'true');
    return ok;
  }
  function nameOk() { return nameInput.value.trim().length >= 2; }
  function emailOk() { return emailInput.value.trim() !== '' && emailInput.checkValidity(); }

  [nameInput, emailInput].forEach(function (input) {
    input.addEventListener('input', function () {
      if (input.closest('.field').classList.contains('invalid')) {
        check(input, input === nameInput ? nameOk() : emailOk());
      }
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var okName = check(nameInput, nameOk());
    var okEmail = check(emailInput, emailOk());
    if (!okName) { nameInput.focus(); return; }
    if (!okEmail) { emailInput.focus(); return; }

    /* No backend yet: keep the details for this browser tab only, then open the form. */
    try {
      sessionStorage.setItem('syri.registrant', JSON.stringify({
        name: nameInput.value.trim(), email: emailInput.value.trim(), at: new Date().toISOString()
      }));
    } catch (err) { /* storage unavailable: carry on */ }
    window.location.href = FORM_PAGE;
  });
}());
</script>
